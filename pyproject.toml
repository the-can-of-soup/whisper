[build-system]

requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"


# Files to include in source distributions
[tool.flit.sdist]

# README.md, LICENSE.txt, pyproject.toml, .gitignore, and src are automatically included
include = ['build.zsh', 'install.zsh']


[project]

name = "whisper-data"
authors = [{name = "the-can-of-soup"}]
dynamic = ["version", "description"]
keywords = ["whisper", "data", "transfer", "file", "message", "cli",
    "command-line interface", "command", "interface", "secure"]

readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Environment :: Console",

    "Topic :: Utilities",
    "Topic :: Communications",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet",

    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "websockets ~= 17.1",
    "tqdm ~= 4.70.1",
]
requires-python = ">= 3.14"


[project.urls]

Homepage = "https://pypi.org/project/whisper_data"
GitHub = "https://github.com/the-can-of-soup/whisper_data"
Issues = "https://github.com/the-can-of-soup/whisper_data/issues"


# Shell command configuration
[project.scripts]

whisper = "whisper_data.cli:whisper"
wis = "whisper_data.cli:whisper"

whisper-certs = "whisper_data.cli:whisper_certs"
wis-certs = "whisper_data.cli:whisper_certs"
